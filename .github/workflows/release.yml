name: release

# Publishing is not a gate. The licence permits anyone to build and redistribute
# this program, and the artifacts here are a convenience for people who would
# rather not.
#
# The build is `build.yml`, called rather than restated: a release that builds
# differently from `main` is a release nobody tested.
#
# What is published is an **unconfigured** client. It has no server compiled in,
# which is the same thing the repository carries, and for the same reason -- a
# public artifact should not be wired to one operator's infrastructure.
# `scripts/configure.py` is how anyone, including us, produces a build that
# already knows where to connect.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the release and uploads to it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A release whose tag disagrees with the version it built is a trap that
      # surfaces months later, in a report about the wrong binary.
      - name: Refuse a tag that does not match the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$version" != "$TAG" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag and crate version agree: $version"

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nremote-linux-x86_64
          path: dist

      - name: Package the bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          if [ -d nremote-linux-x64 ]; then
            tar -czf "nremote-${TAG}-linux-x86_64.tar.gz" nremote-linux-x64
            rm -rf nremote-linux-x64
          fi
          sha256sum ./* > SHA256SUMS
          ls -la
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          # The backticks below are markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            printf 'Linux x86_64 only. macOS and Android are not built yet.\n\n'
            printf 'This client has **no server compiled in**. Point it at yours:\n\n'
            printf '  * ID Server: the host running `hbbs`\n'
            printf '  * Key: the contents of that server`s `id_ed25519.pub`\n\n'
            printf 'Set them under Settings then Network, or compile them in with\n'
            printf '`scripts/configure.py` before building.\n\n'
            printf 'It makes no outbound call of its own: no update check, no telemetry,\n'
            printf 'no device fingerprint, no default API server. See NOTICE.\n'
          } > "$notes"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --notes-file "$notes" \
            dist/*
