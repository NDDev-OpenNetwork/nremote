name: ci

# What this proves is narrower than "the app works", and saying so is the point.
#
# The application is Rust plus Flutter across three operating systems, and a
# full build of it belongs in `build.yml`. This workflow proves the things that
# are true of the source regardless of platform, and it proves them on every
# pull request in under a few minutes: that the product identity has not
# reverted, that the server configuration is still absent from a public
# repository, that the wire protocol still matches the server's, and that the
# shared library compiles clean.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # An upstream merge that reintroduces the prior name would otherwise land
      # silently: nothing about it breaks a build. This is the gate that makes
      # re-running the rename tool part of merging rather than something to
      # remember.
      - name: The product identity has not reverted
        run: python3 scripts/brand.py --check

      # The address of a private deployment must not be committed to a public
      # repository. The constants are supposed to be empty here, and the build
      # supplies them; a commit that fills them in is a leak, not a shortcut.
      - name: No server configuration is committed
        run: |
          set -euo pipefail
          python3 scripts/configure.py --check | tee /tmp/configured.txt
          if ! grep -qx 'RENDEZVOUS_SERVERS = &\[\]' /tmp/configured.txt; then
            echo "a rendezvous server is compiled into this repository" >&2
            exit 1
          fi
          if ! grep -qx 'RS_PUB_KEY         = (empty)' /tmp/configured.txt; then
            echo "a server public key is compiled into this repository" >&2
            exit 1
          fi

      # Checks this repository's copy against the pin, and the server's copy at
      # its pinned release against the same pin. The second half is the one that
      # catches a divergence introduced on the other side.
      - name: The wire protocol still matches the server
        run: python3 scripts/check_protocol_parity.py

  shared-library:
    name: shared-library
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/rust-ci.yml@1ab6708b62ec7bd17f2d8a519c6fcc39edb22243
    with:
      working_directory: libs/hbb_common
      test_matrix_os: '["ubuntu-latest", "macos-latest"]'
      build_command: 'cargo build --locked --all-targets'
      test_command: 'cargo test --locked --all-targets'
      clippy_command: ''
      fmt_command: ''

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/actionlint.yml@1ab6708b62ec7bd17f2d8a519c6fcc39edb22243

  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write # the stale bot closes threads
      pull-requests: write # the labeler applies labels
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/pr-hygiene.yml@1ab6708b62ec7bd17f2d8a519c6fcc39edb22243
